[package]
name = "red_hot"
version = "0.1.0"
edition.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ash = { workspace = true }
ash-window = { workspace = true }
num = { workspace = true }
raw-window-handle = { workspace = true }
red_hot_macros = { workspace = true }
winit = { workspace = true }

[workspace]
members = ["examples/*", "red_hot_macros"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
ash = "0.37.2"
ash-window = "0.12.0"
glb = { git = "https://github.com/MBStarup/glb_rs", version = "0.1.0" }
num = "0.4.3"
proc-macro2 = "1.0.106"
quote = "1.0.44"
rand = "0.10.2"
raw-window-handle = "0.5.0"
red_hot = { path = "." }
red_hot_macros = { path = "red_hot_macros" }
syn = "2.0.117"
winit = "0.27.5"